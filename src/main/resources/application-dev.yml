spring:
  datasource:
    dev:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  mail:
    # Por defecto Microsoft 365 (cuenta corporativa): puerto 587 con STARTTLS.
    # Para un servidor con SSL directo (p. ej. Gmail 465): MAIL_PORT=465,
    # MAIL_SSL=true, MAIL_STARTTLS=false.
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: ${MAIL_STARTTLS:true}
          starttls.required: ${MAIL_STARTTLS:true}
          ssl.enable: ${MAIL_SSL:false}
          ssl.trust: ${MAIL_HOST:smtp.office365.com}
          ssl.protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000