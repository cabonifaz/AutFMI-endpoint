spring:
  datasource:
    prod:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  mail:
    # Por defecto Gmail (contraseña de aplicación): puerto 465 con SSL directo.
    # Para Microsoft 365: MAIL_HOST=smtp.office365.com, MAIL_PORT=587,
    # MAIL_SSL=false, MAIL_STARTTLS=true.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD:} # solo SMTP; con MAIL_PROVIDER=graph no se usa
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: ${MAIL_STARTTLS:false}
          starttls.required: ${MAIL_STARTTLS:false}
          ssl.enable: ${MAIL_SSL:true}
          ssl.trust: ${MAIL_HOST:smtp.gmail.com}
          ssl.protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000
