server:
  port: 8081
  address: 0.0.0.0
  servlet:
    context-path: /fmi
spring:
  application:
    name: aut-fmi
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  profiles:
    include: preprod
jwt:
  expiration: ${JWT_EXPIRATION_MILLISECONDS} # 48 hours in milliseconds
  secret: ${JWT_SECRET}
springdoc:
  swagger-ui:
    path: /fmi-backend.html
  api-docs:
    path: /fmi-docs
# Correo automático de inicio de labores (outsourcing). Activo por defecto;
# se puede suspender con NOTIF_INICIO_ENABLED=false y respeta el maestro 56.
notif:
  inicio:
    enabled: ${NOTIF_INICIO_ENABLED:true}

# Envío de correo: "smtp" (spring.mail.*, por defecto) o "graph" (Microsoft 365
# vía Microsoft Graph, app registrada en Entra ID con Mail.Send de aplicación).
# Con graph, el remitente es MAIL_USERNAME (buzón bdt-fmi@fractal.com.pe).
mail:
  provider: ${MAIL_PROVIDER:smtp}
microsoft:
  graph:
    tenant-id: ${MS_TENANT_ID:}
    client-id: ${MS_CLIENT_ID:}
    client-secret: ${MS_CLIENT_SECRET:}
    # Opcional: UPN o Id. de objeto del buzón si su UPN no es MAIL_USERNAME.
    sender: ${MS_SENDER:}
